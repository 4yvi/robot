version: 2
project_name: robot

builds:
  - id: robot
    main: ./cmd/robot
    binary: robot
    goos: [windows]
    goarch: [amd64]
    env:
      - CGO_ENABLED=1
    tags: [vosk]
    flags: [-trimpath]
    ldflags:
      - -s -w -H=windowsgui -X main.version={{ .Version }}

archives:
  - id: windows
    formats: [zip]
    name_template: "robot_{{ .Version }}_windows_{{ .Arch }}"
    files:
      - config.example.yaml
      - prompt.md
      - README.md
      - LICENSE
      - scripts/setup.ps1
      - src: third_party/vosk/*.dll
        strip_parent: true
      - src: third_party/bundle/amd64/models/**/*
        dst: models
        strip_parent: false

checksum:
  name_template: "checksums_windows.txt"

release:
  mode: append
  replace_existing_artifacts: true

changelog:
  disable: true
