version: 2
project_name: robot

builds:
  - id: robot-arm64
    main: ./cmd/robot
    binary: robot
    goos: [darwin]
    goarch: [arm64]
    env:
      - CGO_ENABLED=1
      - CC=clang -arch arm64
    tags: [vosk]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    hooks:
      post: bash scripts/make-app.sh {{ .Path }} {{ .Version }} {{ .Arch }}
  - id: robot-amd64
    main: ./cmd/robot
    binary: robot
    goos: [darwin]
    goarch: [amd64]
    env:
      - CGO_ENABLED=1
      - CC=clang -arch x86_64
    tags: [vosk]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    hooks:
      post: bash scripts/make-app.sh {{ .Path }} {{ .Version }} {{ .Arch }}

# make-app.sh builds dist/app/<arch>/Robot.app and Robot_<version>_macos_<arch>.zip
# (ditto keeps the bundle layout). Those zips are attached as extra files; the
# meta archive below only carries the setup files.
archives:
  - id: macos-support
    meta: true
    formats: [zip]
    name_template: "robot_{{ .Version }}_macos_setup"
    files:
      - config.example.yaml
      - prompt.md
      - LICENSE
      - scripts/setup.sh

checksum:
  name_template: "checksums_macos.txt"
  extra_files:
    - glob: dist/app/*/Robot_*_macos_*.zip

release:
  mode: append
  replace_existing_artifacts: true
  extra_files:
    - glob: dist/app/*/Robot_*_macos_*.zip

changelog:
  disable: true
