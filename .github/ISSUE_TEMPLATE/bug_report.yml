name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Windows, macOS Apple Silicon, macOS Intel]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Robot version
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines (remove personal data)
      render: text
