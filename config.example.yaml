# Copy to config.yaml (next to the executable or in the user config dir).
wake_word: "робот"
mic_device: ""            # empty = system default; see `robot devices`
speaker_device: ""
vosk_model_path: "models/vosk-model-small-ru"
whisper_url: "http://127.0.0.1:8080"   # robot starts whisper-server itself when this is a local address
whisper_server_path: "models/whisper/whisper-server"   # .exe on Windows
whisper_model_path: "models/whisper/ggml-small.bin"    # downloaded on first run if missing
whisper_model_url: "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin"
lmstudio_url: "http://localhost:1234/v1"
model_name: ""            # pick from the tray menu or set a model id from /v1/models
piper_path: "models/piper/piper"
piper_voice: "models/piper/ru_RU-irina-medium.onnx"
prompt_path: "prompt.md"
silence_ms: 1200
max_phrase_seconds: 30
follow_up_seconds: 8
session_timeout_minutes: 10
max_clarifications: 2
max_tool_calls: 6
stop_phrases: ["хватит", "пока", "стоп"]
autostart: false
allowed_folders: []       # e.g. ["~/Documents", "~/Notes"]
notes_file: ""            # empty = <config dir>/notes.md
apps:                     # name -> command/path for open_app_or_url
  browser: "https://duckduckgo.com"
